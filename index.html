    const deckGrid = document.getElementById('deckGrid');
    INITIAL_KEYS.forEach(k => {
      const div = document.createElement('div');
      div.className = 'deck-key';
      div.innerHTML = `<img src="icons/${k}" alt="Key">`;
      deckGrid.appendChild(div);
    });

    const galleryGrid = document.getElementById('galleryGrid');
    function renderGallery(items) {
      galleryGrid.innerHTML = '';
      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'icon-card';
        card.innerHTML = `
          <img src="${item.path}" alt="${item.name}" loading="lazy">
          <div class="icon-name" title="${item.name}">${item.name.replace(/\s*\(.*?\)/, '')}</div>
          <div class="icon-cat">${item.category}</div>
        `;
        card.onclick = () => {
          const firstKey = deckGrid.children[0];
          firstKey.innerHTML = `<img src="${item.path}" alt="Selected">`;
        };
        galleryGrid.appendChild(card);
      });
    }
    renderGallery(ASSETS);

    const searchInput = document.getElementById('searchInput');
    searchInput.oninput = (e) => {
      const q = e.target.value.toLowerCase();
      const filtered = ASSETS.filter(a => a.name.toLowerCase().includes(q) || a.tags.some(t => t.includes(q)));
      renderGallery(filtered);
    };

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const f = btn.dataset.filter;
        if (f === 'all') renderGallery(ASSETS);
        else renderGallery(ASSETS.filter(a => a.category.includes(f)));
      };
    });
