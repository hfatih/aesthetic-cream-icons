    function resolveImg(imgEl, filename) {
      imgEl.onerror = function() {
        if (!this.dataset.tried) {
          this.dataset.tried = "1";
          this.src = "pink-cream-icons/icons/" + filename;
        } else if (this.dataset.tried === "1") {
          this.dataset.tried = "2";
          this.src = "../icons/" + filename;
        } else if (this.dataset.tried === "2") {
          this.dataset.tried = "3";
          this.src = "icons/" + filename;
        }
      };
      imgEl.src = "icons/" + filename;
    }

    const deckGrid = document.getElementById('deckGrid');
    INITIAL_KEYS.forEach((k, idx) => {
      const div = document.createElement('div');
      div.className = 'deck-key';
      div.dataset.slot = idx;
      const img = document.createElement('img');
      img.alt = 'Key';
      resolveImg(img, k);
      div.appendChild(img);
      deckGrid.appendChild(div);
    });

    const galleryGrid = document.getElementById('galleryGrid');
    function renderGallery(items) {
      galleryGrid.innerHTML = '';
      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'icon-card';
        
        const img = document.createElement('img');
        img.alt = item.name;
        resolveImg(img, item.filename);

        const nameDiv = document.createElement('div');
        nameDiv.className = 'icon-name';
        nameDiv.title = item.name;
        nameDiv.textContent = item.name;

        const catDiv = document.createElement('div');
        catDiv.className = 'icon-category';
        catDiv.textContent = item.category;

        card.appendChild(img);
        card.appendChild(nameDiv);
        card.appendChild(catDiv);

        card.onclick = () => {
          const firstKeyImg = deckGrid.querySelector('.deck-key img');
          if (firstKeyImg) {
            resolveImg(firstKeyImg, item.filename);
          }
        };
        galleryGrid.appendChild(card);
      });
    }
    renderGallery(ASSETS);

    const searchInput = document.getElementById('searchInput');
    searchInput.oninput = (e) => {
      const q = e.target.value.toLowerCase();
      const filtered = ASSETS.filter(a => a.name.toLowerCase().includes(q) || a.category.toLowerCase().includes(q));
      renderGallery(filtered);
    };

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const f = btn.dataset.filter;
        if (f === 'all') {
          renderGallery(ASSETS);
        } else {
          renderGallery(ASSETS.filter(a => a.category.includes(f) || a.finish === f));
        }
      };
    });
  </script>
</body>
</html>
